<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnectHub — Home</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="/index.html" class="logo">ConnectHub</a>
      <nav class="nav" aria-label="Main navigation">
        <a href="/index.html" class="nav__link nav__link--active">Home</a>
        <a href="/create-post.html" class="nav__link">Create Post</a>
        <a href="#" id="nav-profile" class="nav__link">Profile</a>
      </nav>
      <div class="header__actions">
        <span id="nav-username" class="nav__user"></span>
        <button type="button" id="logout-btn" class="btn btn--ghost btn--small">Logout</button>
      </div>
    </div>
  </header>

  <main class="container main">
    <section class="page-header">
      <h1>Your Feed</h1>
      <p class="muted">Posts from people you follow and your own updates.</p>
    </section>

    <div id="feed-loading" class="loading-state">Loading feed...</div>
    <div id="feed-empty" class="empty-state" hidden>
      <h2>Your feed is empty</h2>
      <p>Follow other users or create your first post to get started.</p>
      <a href="/create-post.html" class="btn btn--primary">Create Post</a>
    </div>
    <div id="feed" class="feed"></div>
    <div id="feed-pagination" class="pagination"></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/comments.js"></script>
  <script src="/js/feed.js"></script>
</body>
</html>
