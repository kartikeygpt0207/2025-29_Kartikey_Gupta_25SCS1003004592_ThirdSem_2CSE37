<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnectHub — Register</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body class="auth-page">
  <main class="auth-container">
    <section class="auth-card card">
      <a href="/index.html" class="logo logo--center">ConnectHub</a>
      <h1>Create your account</h1>
      <p class="muted">Join ConnectHub and start sharing with others.</p>

      <div id="form-alert" class="alert" hidden></div>

      <form id="register-form" class="auth-form" novalidate>
        <label class="form-field">
          <span>Name</span>
          <input type="text" id="name" name="name" class="input" autocomplete="name">
        </label>
        <label class="form-field">
          <span>Username</span>
          <input type="text" id="username" name="username" class="input" required autocomplete="username" pattern="[A-Za-z0-9_]{3,30}">
        </label>
        <label class="form-field">
          <span>Email</span>
          <input type="email" id="email" name="email" class="input" required autocomplete="email">
        </label>
        <label class="form-field">
          <span>Password</span>
          <input type="password" id="password" name="password" class="input" required minlength="6" autocomplete="new-password">
        </label>
        <label class="form-field">
          <span>Confirm Password</span>
          <input type="password" id="confirm-password" name="confirmPassword" class="input" required minlength="6" autocomplete="new-password">
        </label>
        <button type="submit" id="register-btn" class="btn btn--primary btn--block">Register</button>
      </form>

      <p class="auth-switch">
        Already have an account?
        <a href="/login.html">Login</a>
      </p>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/posts.js"></script>
</body>
</html>
